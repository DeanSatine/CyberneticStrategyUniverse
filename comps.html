<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comps - Cybernetic Strategy Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="universe.css" />
  <link rel="stylesheet" href="comps.css" />
</head>
<body>
  <div class="ambient">
    <div class="ambient__grid"></div>
    <div class="ambient__glow ambient__glow--purple"></div>
    <div class="ambient__glow ambient__glow--blue"></div>
    <div class="ambient__glow ambient__glow--gold"></div>
    <div class="ambient__scanlines"></div>
  </div>

  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__brand"><span class="nav__brand-mark" aria-hidden="true"></span><span class="nav__brand-text">Cybernetic Strategy</span><span class="nav__brand-sub">Universe</span></a>
      <ul class="nav__links">
        <li><a href="index.html" class="nav__link">Home</a></li>
        <li><a href="units.html" class="nav__link">Units</a></li>
        <li><a href="traits.html" class="nav__link">Traits</a></li>
        <li><a href="stories.html" class="nav__link">Stories</a></li>
        <li><a href="comps.html" class="nav__link nav__link--active">Comps</a></li>
        <li><a href="credits.html" class="nav__link">Credits</a></li>
      </ul>
    </div>
  </nav>

  <main class="comps-page">
    <header class="comps-masthead">
      <div class="container">
        <p class="section-tag">Strategy Archive</p>
        <h1 class="comps-title">Comps</h1>
      </div>
    </header>

    <section class="comps-browser container" aria-label="Composition browser">
      <div class="comps-toolbar">
        <label class="comps-search"><span>Search archive</span><input id="compSearch" type="search" placeholder="Search comps, units, traits..." /></label>
        <div class="comps-filter-group" role="group" aria-label="Comp style">
          <span class="comps-filter-label">Comp style</span>
          <button class="comp-filter is-active" data-style="all" type="button">All</button>
          <button class="comp-filter" data-style="Standard" type="button">Standard</button>
          <button class="comp-filter" data-style="Reroll" type="button">Reroll</button>
          <button class="comp-filter" data-style="Slow Roll" type="button">Slow Roll</button>
          <button class="comp-filter" data-style="Fast 8" type="button">Fast 8</button>
          <a class="comps-editor-link" href="editor.html">Edit comps</a>
        </div>
      </div>
      <div class="comps-results-head"><span id="compCount">0 compositions</span><span>Launch archive</span></div>
      <div class="comps-tierlist" id="compsGrid"></div>
      <p class="comps-empty" id="compsEmpty" hidden>No compositions added yet.</p>
    </section>
  </main>

  <div class="comp-detail-backdrop" id="compBackdrop"></div>
  <aside class="comp-detail" id="compDetail" aria-hidden="true" aria-labelledby="compDetailTitle">
    <button class="comp-detail__close" id="compClose" type="button" aria-label="Close composition details">×</button>
    <div id="compDetailContent"></div>
  </aside>

  <footer class="footer"><div class="container"><div class="footer__inner"><div class="footer__brand"><span class="nav__brand-mark" aria-hidden="true"></span><span>Cybernetic Strategy Universe</span></div><p class="footer__portfolio"><a href="credits.html">Credits</a></p></div></div></footer>
  <script src="data.js"></script>
  <script src="site-data-patch.js"></script>
  <script src="comps.js"></script>
</body>
</html>
