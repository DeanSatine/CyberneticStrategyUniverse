<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Units - Cybernetic Strategy Galaxy Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="universe.css" />
  <style>

    /* -- PAGE SHELL ------------------------------- */
    .units-page {
      padding: 10rem 0 8rem;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* -- FILTERS ---------------------------------- */
    .filters-bar {
      display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-end;
      padding: 2.5rem 3rem;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      margin-bottom: 3rem;
    }
    .filters-bar__group { display: flex; flex-direction: column; gap: 0.8rem; }
    .filters-bar__label {
      font-family: var(--font-mono); font-size: 0.9rem;
      letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-dim);
    }
    .filters-bar__btns { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .filter-btn {
      font-family: var(--font-mono); font-size: 1rem; letter-spacing: 0.1em;
      padding: 0.6rem 1.4rem; background: transparent;
      border: 1px solid var(--border-dim); color: var(--text-dim);
      border-radius: 3px; cursor: pointer; transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
    .filter-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
    .search-row { margin-left: auto; display: flex; align-items: flex-end; }
    .page-search {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border-dim);
      color: var(--text-bright); font-family: var(--font-body); font-size: 1.6rem;
      padding: 0.8rem 1.6rem; border-radius: 4px; width: 260px; outline: none;
      transition: border-color 0.2s;
    }
    .page-search:focus { border-color: var(--gold); }
    .page-search::placeholder { color: var(--text-dim); }

    .units-count {
      font-family: var(--font-mono); font-size: 1.2rem; color: var(--text-dim);
      letter-spacing: 0.12em; margin-bottom: 3rem;
    }
    .units-count span { color: var(--gold); }

    /* -- UNIT GRID -------------------------------- */
    .all-units-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2rem;
    }

    /* -- UNIT CARD -------------------------------- */
    .ucf {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .ucf:hover {
      transform: translateY(-5px);
      border-color: rgba(201,168,76,0.4);
      box-shadow: 0 16px 48px rgba(0,0,0,0.55);
    }

    /* Card portrait - 3:4 ratio, uses [Name]Card.png */
    .ucf__portrait {
      width: 100%;
      aspect-ratio: 3 / 4;
      position: relative;
      overflow: hidden;
      background: var(--bg-panel);
    }
    .ucf__portrait img {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      padding: 1.2rem 1.2rem 0.6rem;
      transition: transform 0.2s ease;
    }
    .ucf:hover .ucf__portrait img { filter: brightness(1.08); transform: scale(1.02); }

    /* Fallback colour bg when image missing */
    .ucf__portrait-fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 7rem;
    }
    .ucf__portrait-img { position: relative; z-index: 1; }

    /* Cost badge top-right */
    .ucf__cost-badge { display: none; }

    /* Bottom gradient fade */
    .ucf__portrait-shade {
      position: absolute; bottom: 0; left: 0; right: 0; height: 55%;
      background: linear-gradient(0deg, rgba(6,8,16,1) 0%, rgba(6,8,16,0.6) 50%, transparent 100%);
      z-index: 2;
    }

    /* Unit info sits over the bottom of the portrait */
    .ucf__info {
      padding: 1.4rem 1.6rem 1.6rem;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-dim);
      flex: 1;
    }

    /* Name + editable subtitle */
    .ucf__name-row {
      display: flex; align-items: center;
      margin-bottom: 0.45rem;
    }
    .ucf__name {
      font-family: var(--font-display);
      font-size: 1.4rem; letter-spacing: 0.06em;
      color: var(--text-bright); text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    .ucf__subtitle {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ucf__no-results {
      grid-column: 1/-1; text-align: center; padding: 8rem 0;
      font-family: var(--font-display); font-size: 2.2rem;
      color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase;
    }

    /* -- UNIT BIO FOCAL DOSSIER ------------------ */
    .bio-panel {
      position: absolute;
      top: 3rem; left: 50%;
      width: min(1280px, calc(100vw - 6rem));
      min-height: min(820px, calc(100vh - 6rem));
      height: auto;
      z-index: 300;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: grid;
      grid-template-columns: minmax(380px, 0.9fr) minmax(0, 1.1fr);
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) scale(0.96);
      transition: opacity 0.25s ease, transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: visible;
    }
    .bio-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    .bio-panel__backdrop {
      position: fixed; inset: 0; z-index: 299;
      background: rgba(2,4,12,0.86);
      backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .bio-panel__backdrop.open { opacity: 1; pointer-events: all; }

    /* Portrait occupies the left half of the dossier. */
    .bio-panel__portrait {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--border-dim);
      background: var(--bg-panel);
    }
    .bio-panel__portrait img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .bio-panel__portrait-fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12rem;
    }
    .bio-panel__portrait-shade {
      position: absolute; inset: 0;
      background: linear-gradient(0deg, rgba(4,7,20,0.98) 0%, rgba(4,7,20,0.28) 58%, transparent 100%);
    }

    /* Close button */
    .bio-panel__close {
      position: absolute; top: 1.5rem; right: 1.5rem; z-index: 10;
      width: 40px; height: 40px; border-radius: 4px;
      background: rgba(6,8,16,0.8); border: 1px solid var(--border-dim);
      color: var(--text-mid); font-size: 1.8rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s;
    }
    .bio-panel__close:hover { border-color: var(--gold); color: var(--gold); }

    /* Header overlaid on bottom of portrait */
    .bio-panel__header {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 3.5rem;
      z-index: 5;
    }
    .bio-panel__cost-row {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 0.8rem;
    }
    .bio-panel__cost-gems { display: flex; gap: 5px; }
    .bio-panel__cost-gem {
      width: 12px; height: 12px; border-radius: 50%;
    }
    .bio-panel__role {
      font-family: var(--font-mono); font-size: 1.15rem;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim);
    }
    .bio-panel__name {
      font-family: var(--font-display);
      font-size: clamp(3.6rem, 5vw, 5.8rem);
      font-weight: 400; color: var(--text-bright);
      letter-spacing: 0.08em; text-transform: uppercase;
      line-height: 1; margin-bottom: 1.2rem;
    }
    /* Trait icons + names in header */
    .bio-panel__trait-row {
      display: flex; gap: 1rem; flex-wrap: wrap;
    }
    .bio-panel__trait-tag {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.4rem 1rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 3px;
      background: rgba(6,8,16,0.6);
    }
    .bio-panel__trait-tag img {
      width: 18px; height: 18px; border-radius: 2px; object-fit: cover;
    }
    .bio-panel__trait-tag-mark { font-size: 1.4rem; line-height: 1; }
    .bio-panel__trait-tag-name {
      font-family: var(--font-mono); font-size: 1rem;
      letter-spacing: 0.1em; text-transform: uppercase;
    }

    /* The dossier grows with its content; the document handles page scrolling. */
    .bio-panel__body {
      min-width: 0;
      height: auto;
      overflow: visible;
      padding: 4rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .bio-panel__body::-webkit-scrollbar { width: 4px; }
    .bio-panel__body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .bio-panel__section-label {
      font-family: var(--font-mono); font-size: 1.1rem;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 1.5rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .bio-panel__section-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border-dim);
    }

    .bio-panel__context-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-bottom: 3rem;
    }
    .bio-panel__context-item {
      min-width: 0;
      padding: 1.25rem 1.5rem;
      background: rgba(10,14,34,0.72);
      border: 1px solid var(--border-dim);
      border-radius: 4px;
    }
    .bio-panel__context-label {
      display: block;
      margin-bottom: 0.55rem;
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .bio-panel__context-value {
      display: block;
      color: var(--text-bright);
      font-family: var(--font-body);
      font-size: 1.4rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .bio-panel__context-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin: -0.25rem 0 3rem;
    }
    .bio-panel__context-tag {
      display: inline-flex;
      padding: 0.65rem 0.9rem;
      color: var(--text-mid);
      font: inherit;
      font-family: var(--font-mono);
      font-size: 1rem;
      letter-spacing: 0.05em;
      background: rgba(10,14,34,0.72);
      border: 1px solid var(--border-dim);
      border-radius: 3px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }
    .bio-panel__context-tag:hover {
      color: var(--gold);
      background: rgba(22,28,58,0.86);
      border-color: var(--gold);
    }
    .bio-panel__related-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
      margin-bottom: 3rem;
    }
    .bio-panel__related-unit {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      min-width: 0;
      padding: 0.75rem;
      color: var(--text-bright);
      text-align: left;
      background: rgba(10,14,34,0.72);
      border: 1px solid var(--border-dim);
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .bio-panel__related-unit:hover {
      background: rgba(22,28,58,0.86);
      border-color: var(--gold);
      transform: translateY(-2px);
    }
    .bio-panel__related-image {
      position: relative;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      overflow: hidden;
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-radius: 3px;
    }
    .bio-panel__related-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .bio-panel__related-mark {
      position: absolute;
      color: var(--text-dim);
      font-family: var(--font-display);
      font-size: 1.05rem;
    }
    .bio-panel__related-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 0.25rem;
    }
    .bio-panel__related-copy strong {
      overflow: hidden;
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bio-panel__related-copy small {
      overflow: hidden;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Lore / bio text */
    .bio-panel__lore {
      font-size: 2rem;
      color: var(--text-mid);
      font-style: italic;
      line-height: 1.85;
      margin-bottom: 3rem;
    }
    .bio-panel__lore p { margin-bottom: 1.4em; }
    .bio-panel__lore p:last-child { margin-bottom: 0; }

    /* Placeholder bio block */
    .bio-panel__placeholder {
      border: 1px dashed rgba(201,168,76,0.2);
      border-radius: 4px;
      padding: 3rem;
      text-align: left;
      margin-bottom: 3rem;
    }
    .bio-panel__placeholder-icon { font-size: 1.15rem; margin-bottom: 1.8rem; opacity: 0.75; }
    .bio-panel__placeholder-text {
      font-family: var(--font-body); font-size: 1.75rem;
      letter-spacing: 0; text-transform: none;
      color: var(--text-mid); line-height: 1.7;
    }

    .bio-panel__ability {
      margin-bottom: 3rem;
      padding: 1.5rem;
      background: rgba(10,14,34,0.72);
      border: 1px solid var(--border-dim);
      border-radius: 4px;
    }
    .bio-panel__ability-media {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      margin-bottom: 1.5rem;
      background: #050711;
      border: 1px solid var(--border-dim);
      border-radius: 3px;
    }
    .bio-panel__ability-media video,
    .bio-panel__ability-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .bio-panel__ability-media-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .bio-panel__ability-copy {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
    }
    .bio-panel__ability-icon {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      object-fit: cover;
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
    }
    .bio-panel__ability-icon-fallback {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 1.4rem;
      background: rgba(201,168,76,0.08);
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
    }
    .bio-panel__ability-description {
      min-width: 0;
      color: var(--text-mid);
      font-family: var(--font-body);
      font-size: 1.7rem;
      line-height: 1.65;
    }
    .bio-panel__ability-description strong {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--text-bright);
      font-family: var(--font-display);
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Trait detail in bio */
    .bio-panel__traits-detail { display: flex; flex-direction: column; gap: 1rem; }
    .bio-panel__trait-block {
      display: flex; align-items: center; gap: 1.5rem;
      padding: 1.4rem 1.8rem;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 4px;
    }
    .bio-panel__trait-block img {
      width: 36px; height: 36px; border-radius: 4px; object-fit: cover; flex-shrink: 0;
    }
    .bio-panel__trait-block-mark { font-size: 2.8rem; flex-shrink: 0; }
    .bio-panel__trait-block-info {}
    .bio-panel__trait-block-name {
      font-family: var(--font-display); font-size: 1.55rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-bright); margin-bottom: 0.3rem;
    }
    .bio-panel__trait-block-type {
      font-family: var(--font-mono); font-size: 1.15rem;
      line-height: 1.55;
      letter-spacing: 0.04em; color: var(--text-dim);
    }

    @media (max-width: 900px) {
      .bio-panel {
        width: calc(100vw - 2rem);
        min-height: calc(100vh - 2rem);
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(280px, 42vh) auto;
      }
      .bio-panel__portrait {
        height: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--border-dim);
      }
      .bio-panel__header { padding: 2.4rem; }
      .bio-panel__body { padding: 2.5rem; }
    }

    @media (max-width: 700px) {
      .all-units-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.4rem; }
    }

    @media (max-width: 520px) {
      .bio-panel {
        width: 100vw;
        min-height: 100vh;
        height: auto;
        top: 0;
        border: 0;
        border-radius: 0;
      }
      .bio-panel__name { font-size: 3.2rem; }
      .bio-panel__placeholder { padding: 2rem; }
      .bio-panel__placeholder-text { font-size: 1.55rem; }
      .bio-panel__context-grid,
      .bio-panel__related-grid { grid-template-columns: 1fr; }
      .bio-panel__ability-copy { gap: 1rem; }
      .bio-panel__ability-icon,
      .bio-panel__ability-icon-fallback { width: 60px; height: 60px; flex-basis: 60px; }
      .bio-panel__ability-description { font-size: 1.45rem; }
    }
  </style>
</head>
<body>

  <div class="ambient">
    <div class="ambient__grid"></div>
    <div class="ambient__glow ambient__glow--purple"></div>
    <div class="ambient__glow ambient__glow--blue"></div>
    <div class="ambient__scanlines"></div>
  </div>

  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__brand">
        <span class="nav__brand-mark" aria-hidden="true"></span>
        <span class="nav__brand-text">Cybernetic Strategy</span>
        <span class="nav__brand-sub">Universe</span>
      </a>
      <ul class="nav__links">
        <li><a href="index.html" class="nav__link">Home</a></li>
        <li><a href="units.html" class="nav__link nav__link--active">Units</a></li>
        <li><a href="traits.html" class="nav__link">Traits</a></li>
        <li><a href="stories.html" class="nav__link">Stories</a></li>
        <li><a href="credits.html" class="nav__link">Credits</a></li>
      </ul>
    </div>
  </nav>

  <main class="units-page">
    <div class="container">

      <div style="margin-bottom:5rem;text-align:center">
        <span class="section-tag">Roster Map</span>
        <h1 class="section-title">All Units</h1>
        <p class="section-desc">Browse every unit in the Dominion roster and assign each one a custom title subtitle.</p>
      </div>

      <div class="filters-bar">
        <div class="filters-bar__group">
          <span class="filters-bar__label">Cost Tier</span>
          <div class="filters-bar__btns" id="costFilters">
            <button class="filter-btn active" data-cost="all">All</button>
            <button class="filter-btn" data-cost="1"><span class="cost-pip cost-1">1</span></button>
            <button class="filter-btn" data-cost="2"><span class="cost-pip cost-2">2</span></button>
            <button class="filter-btn" data-cost="3"><span class="cost-pip cost-3">3</span></button>
            <button class="filter-btn" data-cost="4"><span class="cost-pip cost-4">4</span></button>
            <button class="filter-btn" data-cost="5"><span class="cost-pip cost-5">5</span></button>
          </div>
        </div>
        <div class="filters-bar__group">
          <span class="filters-bar__label">Role</span>
          <div class="filters-bar__btns" id="roleFilters">
            <button class="filter-btn active" data-role="all">All</button>
            <button class="filter-btn" data-role="tank">Tank</button>
            <button class="filter-btn" data-role="fighter">Fighter</button>
            <button class="filter-btn" data-role="caster">Caster</button>
            <button class="filter-btn" data-role="marksman">Marksman</button>
            <button class="filter-btn" data-role="hybrid">Hybrid</button>
          </div>
        </div>
        <div class="search-row">
          <input type="text" class="page-search" id="unitSearch" placeholder="Search units..." />
        </div>
      </div>

      <p class="units-count">Showing <span id="unitCount">0</span> units</p>
      <div class="all-units-grid" id="allUnitsGrid"></div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <div class="footer__brand">
          <span class="nav__brand-mark" aria-hidden="true"></span>
          <span>Cybernetic Strategy Universe</span>
        </div>
        <p class="footer__portfolio"><a href="../index.html">Back to Portfolio</a></p>
      </div>
    </div>
  </footer>

  <!-- BIO PANEL BACKDROP -->
  <div class="bio-panel__backdrop" id="bioBackdrop"></div>

  <!-- BIO PANEL -->
  <aside class="bio-panel" id="bioPanel" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="bioPanelName">
    <button class="bio-panel__close" id="bioPanelClose">Close</button>
    <div class="bio-panel__portrait" id="bioPanelPortrait">
      <div class="bio-panel__portrait-fallback" id="bioPanelFallback"></div>
      <img id="bioPanelImg" src="" alt="" decoding="async" onerror="tryNextUnitCardImage(this)" />
      <div class="bio-panel__portrait-shade"></div>
      <div class="bio-panel__header">
        <div class="bio-panel__cost-row">
          <div class="bio-panel__cost-gems" id="bioCostGems"></div>
          <span class="bio-panel__role" id="bioPanelRole"></span>
        </div>
        <h2 class="bio-panel__name" id="bioPanelName"></h2>
        <div class="bio-panel__trait-row" id="bioPanelTraitRow"></div>
      </div>
    </div>
    <div class="bio-panel__body" id="bioPanelBody"></div>
  </aside>

  <script src="data.js"></script>
  <script src="site-data-patch.js"></script>
  <script src="universe.js"></script>
  <script>


    function getInitialMark(text, fallback = "CS") {
      const source = String(text || fallback).replace(/[^a-zA-Z0-9 ]/g, " ").trim();
      if (!source) return fallback;
      const parts = source.split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return source.slice(0, 2).toUpperCase();
    }
    function traitMark(traitName) { return getInitialMark(traitName, "TR"); }
    function unitMark(unit) { return getInitialMark(unit && unit.name, "UN"); }

    function imageSafeName(value) {
      return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, "");
    }

    function uniqueList(values) {
      const out = [];
      const seen = new Set();
      (values || []).forEach(value => {
        const cleaned = String(value || "").trim();
        if (!cleaned || seen.has(cleaned)) return;
        seen.add(cleaned);
        out.push(cleaned);
      });
      return out;
    }

    function unitCardImageCandidates(unit) {
      const safeName = imageSafeName(unit && unit.name);
      const baseName = unit && unit.imageName ? String(unit.imageName) : safeName;
      const stems = uniqueList([
        unit && unit.cardImageName,
        baseName ? `${baseName}Card` : "",
        safeName ? `${safeName}Card` : "",
        unit && unit.id ? `${imageSafeName(unit.id)}Card` : ""
      ]);
      const exts = ["png", "PNG", "jpg", "jpeg", "webp"];
      const paths = [];
      stems.forEach(stem => paths.push(`./images/optimized/units/${stem}.webp`));
      stems.forEach(stem => exts.forEach(ext => paths.push(`./images/units/${stem}.${ext}`)));
      return uniqueList(paths);
    }

    function tryNextUnitCardImage(img) {
      const paths = String(img.dataset.imageCandidates || "").split("|").filter(Boolean);
      let index = Number(img.dataset.imageIndex || 0) + 1;
      if (index < paths.length) {
        img.dataset.imageIndex = String(index);
        img.src = paths[index];
        return;
      }
      img.style.display = "none";
      if (img.id === "bioPanelImg") {
        const fb = document.getElementById("bioPanelFallback");
        if (fb) fb.style.display = "flex";
        return;
      }
      if (img.nextElementSibling) img.nextElementSibling.style.display = "flex";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function unitNameKey(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function unitLoreMentions(lore, name) {
      const escaped = String(name || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      if (!escaped) return false;
      return new RegExp(`(^|[^a-z0-9])${escaped}([^a-z0-9]|$)`, "i").test(String(lore || ""));
    }

    function getUnitArchiveContext(unit) {
      const unitKey = unitNameKey(unit.name);
      const factions = (CS_DATA.factions || []).filter(faction =>
        (faction.members || []).some(member => unitNameKey(member) === unitKey)
      );
      const related = [];
      const relatedKeys = new Set();
      const addRelated = candidate => {
        if (!candidate || unitNameKey(candidate.name) === unitKey) return;
        const candidateKey = unitNameKey(candidate.name);
        if (relatedKeys.has(candidateKey)) return;
        relatedKeys.add(candidateKey);
        related.push(candidate);
      };
      (CS_DATA.units || []).forEach(candidate => {
        if (unitLoreMentions(unit.lore, candidate.name)) addRelated(candidate);
      });
      factions.forEach(faction => {
        (faction.members || []).forEach(member => {
          addRelated((CS_DATA.units || []).find(candidate => unitNameKey(candidate.name) === unitNameKey(member)));
        });
      });
      return { factions, related };
    }

    function renderRelatedUnit(unit) {
      const imagePath = unitCardImageCandidates(unit)[0] || "";
      return `
        <button class="bio-panel__related-unit" type="button" data-related-unit="${escapeHtml(unit.id)}">
          <span class="bio-panel__related-image">
            <img src="${escapeHtml(imagePath)}" alt="" loading="lazy" decoding="async" onerror="this.style.display='none'" />
            <span class="bio-panel__related-mark">${escapeHtml(unitMark(unit))}</span>
          </span>
          <span class="bio-panel__related-copy">
            <strong>${escapeHtml(unit.name)}</strong>
            <small>${escapeHtml(unit.role || "Unit")}</small>
          </span>
        </button>
      `;
    }

    function abilityAssetPath(value, directory) {
      const asset = String(value || '').trim();
      if (!asset) return '';
      if (/^(https?:)?\/\//i.test(asset) || asset.startsWith('./') || asset.startsWith('../') || asset.startsWith('/')) return asset;
      return `./images/${directory}/${asset}`;
    }

    function cleanAbilityDescription(summary) {
      let text = String(summary || '').trim();
      if (!text) return '';
      text = text.replace(/^-?AbilityActive:\s*/i, 'Active: ');
      text = text.replace(/\b(?:Damage|Shield|Heal|Healing|Health Gain|AD Gain|MR Reduction|Armour Reduction|Stun|Bonus Damage|Passive Damage|Ability Damage|Target Damage|Overkill Damage)\s*:\s*[^.]+/gi, '');
      text = text.replace(/\b\d+(?:\.\d+)?(?:\s*\/\s*\d+(?:\.\d+)?)+(?:\s*\+\s*[\d.%/\sA-Za-z]+)?\s*(?=(?:damage|shield|health|healing|armour|magic resist|attack speed|AD|AP)\b)/gi, '');
      text = text.replace(/\b\d+(?:\.\d+)?\s*(?:%\s*)?(?=(?:damage|shield|health|healing|armour|magic resist|attack speed|AD|AP)\b)/gi, '');
      (CS_DATA.units || []).slice().sort((a, b) => String(b.name).length - String(a.name).length).forEach(candidate => {
        const escaped = String(candidate.name || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        text = text.replace(new RegExp(`\\s+${escaped}$`, 'i'), '');
      });
      return text.replace(/\s{2,}/g, ' ').replace(/\s+([,.])/g, '$1').trim();
    }

    const COST_COLORS_PAGE = { 1:"#888", 2:"#3a9940", 3:"#3a60c0", 4:"#8830c0", 5:"#c9a84c" };

    // X = horizontal focal point of unit art within the landscape source image
    // object-fit:cover on portrait card crops the landscape image horizontally
    // Y is always "top" since units are in upper portion of landscape images
    const UNIT_POSITIONS = {
      acolyte        : "top 62%",
      aetherion      : "top 55%",
      anchorfire     : "top 55%",
      arcanode       : "top 65%",
      autoshot       : "top 57%",
      bop            : "top 53%",
      backslash      : "top 60%",
      bedrock        : "top 52%",
      biosynth       : "top 60%",
      boltjaw        : "top 54%",
      burnbyte       : "top 57%",
      cobaltine      : "top 57%",
      commandcore    : "top 54%",
      consumeos      : "top 42%",
      coreweaver     : "top 57%",
      dashblade      : "top 60%",
      drboost        : "top 61%",
      dreadline      : "top 51%",
      duskblade      : "top 49%",
      edgex          : "top 57%",
      exodium        : "top 57%",
      fireline       : "top 51%",
      forticore      : "top 52%",
      frontpoint     : "top 57%",
      gravemarch     : "top 54%",
      haymaker       : "top 51%",
      headshot       : "top 56%",
      hookflail      : "top 49%",
      hull           : "top 48%",
      hypershot      : "top 48%",
      irondon        : "top 56%",
      ironveil       : "top 55%",
      k4ge           : "top 53%",
      knox           : "top 55%",
      killswitch     : "top 59%",
      kobolt         : "top 47%",
      kuromushado    : "top 54%",
      litanynode     : "top 56%",
      loadbearer     : "top 55%",
      lockcore       : "top 59%",
      munchr         : "top 56%",
      magnetrix      : "top 56%",
      manadrive      : "top 54%",
      masterprime    : "top 51%",
      mechclock      : "top 57%",
      mechsoon       : "top 58%",
      mechssiah      : "top 56%",
      needlebot      : "top 52%",
      novaburst      : "top 57%",
      overstrike     : "top 61%",
      overturn       : "top 59%",
      patch          : "top 54%",
      pinpoint       : "top 51%",
      plungedrill    : "top 54%",
      prime78        : "top 45%",
      prototypev     : "top 45%",
      pulsefist      : "top 52%",
      rngine         : "top 58%",
      rocketbott     : "top 58%",
      rotora         : "top 52%",
      runewall       : "top 56%",
      sanguinox      : "top 52%",
      satellitetitan : "top 57%",
      servoswing     : "top 58%",
      shardframe     : "top 59%",
      sharplink      : "top 57%",
      sightline      : "top 54%",
      sisteraegis    : "top 55%",
      skydrive       : "top 52%",
      slicenode      : "top 50%",
      socratech      : "top 57%",
      soulsync       : "top 55%",
      splitshine     : "top 56%",
      springlock     : "top 56%",
      starbreaker    : "top 57%",
      starstruck     : "top 56%",
      steelguard     : "top 62%",
      steelrunner    : "top 59%",
      steelshade     : "top 56%",
      stormcoil      : "top 61%",
      swiftframe     : "top 58%",
      thunk          : "top 55%",
      tracercore     : "top 57%",
      whirlguard     : "top 60%",
      widowframe     : "top 58%",
    };

    let activeCost = "all";
    let activeRole = "all";
    let activeSearch = "";

    function getRoleCat(role) {
      if (!role) return "hybrid";
      const r = role.toLowerCase();
      if (r.includes("tank")) return "tank";
      if (r.includes("marksman")) return "marksman";
      if (r.includes("fighter") || r.includes("assassin")) return "fighter";
      if (r.includes("caster") && !r.includes("attack")) return "caster";
      return "hybrid";
    }

    // Build trait icon HTML. If a custom image is missing, use a short text code.
    function traitIconHTML(traitName, size = 20) {
      const safeName = imageSafeName(traitName);
      const imgPath = `./images/optimized/traits/${safeName}Icon.webp`;
      const mark = traitMark(traitName);
      return `
        <div class="ucf__trait-icon" title="${traitName}" style="width:${size}px;height:${size}px">
          <img src="${imgPath}" alt="${traitName}" loading="lazy" decoding="async"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
               style="width:100%;height:100%;object-fit:cover;display:block" />
          <span class="ucf__trait-icon-fallback" style="display:none">${mark}</span>
        </div>
      `;
    }

    function renderAllUnits() {
      const grid = document.getElementById("allUnitsGrid");
      const filtered = CS_DATA.units.filter(unit => {
        const costMatch = activeCost === "all" || String(unit.cost) === activeCost;
        const roleMatch = activeRole === "all" || getRoleCat(unit.role) === activeRole;
        const traitSearchText = (Array.isArray(unit.traits) ? unit.traits : []).join(" ").toLowerCase();
        const searchMatch = !activeSearch ||
          String(unit.name || "").toLowerCase().includes(activeSearch) ||
          traitSearchText.includes(activeSearch) ||
          String(unit.role || "").toLowerCase().includes(activeSearch);
        return costMatch && roleMatch && searchMatch;
      });

      if (activeCost === "all") {
        filtered.sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), undefined, { sensitivity: "base" }));
      }

      document.getElementById("unitCount").textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="ucf__no-results">No units found</div>`;
        return;
      }

      grid.innerHTML = filtered.map(unit => {
        const mark = unitMark(unit);
        const costColor = COST_COLORS_PAGE[unit.cost] || "#888";
        const imageCandidates = unitCardImageCandidates(unit);
        const imgPath = imageCandidates[0] || "";

        const subtitle = unit.subtitle || "Subtitle";
        
        return `
          <div class="ucf" onclick="openBioPanel('${unit.id}')">
            <div class="ucf__portrait" style="background:linear-gradient(160deg,${costColor}25,#06081099)">
              <img class="ucf__portrait-img"
                   src="${imgPath}"
                   alt="${unit.name}"
                   loading="lazy"
                   decoding="async"
                   data-image-index="0"
                   data-image-candidates="${imageCandidates.join('|')}"
                   style="object-fit:contain;object-position:center center;padding:1.2rem 1.2rem 0.6rem"
                   onerror="tryNextUnitCardImage(this)" />
              <div class="ucf__portrait-fallback" style="display:none">${mark}</div>
              <div class="ucf__portrait-shade"></div>
            </div>
            <div class="ucf__info">
              <div class="ucf__name-row">
                <span class="ucf__name">${unit.name}</span>
              </div>
              <div class="ucf__subtitle">${subtitle}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    // -- BIO PANEL ---------------------------------------------
    function openBioPanel(unitId) {
      const unit = CS_DATA.units.find(u => String(u.id) === String(unitId));
      if (!unit) return;

      const costColor = COST_COLORS_PAGE[unit.cost] || "#888";
      const imageCandidates = unitCardImageCandidates(unit);
      const imgPath = imageCandidates[0] || "";
      const mark = unitMark(unit);

      // Portrait
      const img = document.getElementById("bioPanelImg");
      const fallback = document.getElementById("bioPanelFallback");
      img.dataset.imageIndex = "0";
      img.dataset.imageCandidates = imageCandidates.join("|");
      img.src = imgPath;
      img.alt = unit.name;
      img.style.display = "block";
      img.style.objectFit = "contain";
      img.style.objectPosition = "center center";
      img.style.padding = "1.8rem 1.8rem 0.8rem";
      fallback.textContent = unitMark(unit);
      fallback.style.display = "none";
      document.getElementById("bioPanelPortrait").style.background =
        `linear-gradient(160deg, ${costColor}30, #06081099)`;

      // Cost gems
      document.getElementById("bioCostGems").innerHTML =
        Array.from({length: unit.cost}, () =>
          `<div class="bio-panel__cost-gem" style="background:${costColor}"></div>`
        ).join("");

      // Role & name
      document.getElementById("bioPanelRole").textContent = unit.role;
      document.getElementById("bioPanelName").textContent = unit.name;

      // Trait row intentionally hidden on unit click panels.
      document.getElementById("bioPanelTraitRow").innerHTML = "";

      const archiveContext = getUnitArchiveContext(unit);
      const identityEntries = [
        ["From", unit.origin || "Not recorded"],
        unit.currentResidence ? ["Current residence", unit.currentResidence] : null,
        ["Species", unit.species || "Not recorded"],
        ["Years active", unit.yearsActive || "Not recorded"],
        unit.fullName && unit.fullName !== unit.name ? ["Full name", unit.fullName] : null
      ].filter(Boolean);
      const identityHTML = identityEntries.map(([label, value]) => `
        <div class="bio-panel__context-item">
          <span class="bio-panel__context-label">${escapeHtml(label)}</span>
          <span class="bio-panel__context-value">${escapeHtml(value)}</span>
        </div>
      `).join("");
      const affiliationsHTML = archiveContext.factions.length ? `
        <div class="bio-panel__section-label">Affiliations</div>
        <div class="bio-panel__context-tags">
          ${archiveContext.factions.map(faction => `<button class="bio-panel__context-tag" type="button" data-affiliation-story="${escapeHtml(faction.id)}" title="Open ${escapeHtml(faction.name)} story">${escapeHtml(faction.name)}</button>`).join("")}
        </div>
      ` : "";
      const relatedHTML = archiveContext.related.length ? `
        <div class="bio-panel__section-label">Related characters</div>
        <div class="bio-panel__related-grid">
          ${archiveContext.related.map(renderRelatedUnit).join("")}
        </div>
      ` : "";
      const abilityDescription = String(unit.abilityDescription || '').trim() || cleanAbilityDescription(unit.abilitySummary);
      const abilityIcon = abilityAssetPath(unit.abilityIcon || unit.abilityIconName, 'abilities');
      const abilityVideo = abilityAssetPath(unit.abilityVideo || unit.abilityVideoPath, 'abilities');
      const abilityGif = abilityAssetPath(unit.abilityGif || unit.abilityGifPath, 'abilities');
      const abilityMedia = abilityVideo || abilityGif ? `
        <div class="bio-panel__ability-media">
          ${abilityVideo ? `<video src="${escapeHtml(abilityVideo)}" autoplay muted loop playsinline preload="metadata" onerror="this.style.display='none';${abilityGif ? "this.nextElementSibling.style.display='block';" : "this.nextElementSibling.nextElementSibling.style.display='grid';"}"></video>` : ''}
          ${abilityGif ? `<img src="${escapeHtml(abilityGif)}" alt="${escapeHtml(unit.name)} ability demonstration" ${abilityVideo ? 'style="display:none"' : ''} onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" />` : ''}
          <span class="bio-panel__ability-media-fallback" style="display:${abilityVideo || abilityGif ? 'none' : 'grid'}">Ability demonstration coming soon</span>
        </div>
      ` : '';
      const abilityIconHTML = abilityIcon
        ? `<img class="bio-panel__ability-icon" src="${escapeHtml(abilityIcon)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" /><span class="bio-panel__ability-icon-fallback" style="display:none">ABILITY</span>`
        : '<span class="bio-panel__ability-icon-fallback">ABILITY</span>';
      const abilityHTML = abilityDescription || abilityIcon || abilityVideo || abilityGif ? `
        <div class="bio-panel__section-label">Ability</div>
        <div class="bio-panel__ability">
          ${abilityMedia}
          <div class="bio-panel__ability-copy">
            ${abilityIconHTML}
            <div class="bio-panel__ability-description">
              <strong>${escapeHtml(unit.name)} ability</strong>
              ${escapeHtml(abilityDescription || 'Ability description will be added here.')}
            </div>
          </div>
        </div>
      ` : '';
      document.getElementById("bioPanelBody").innerHTML = `
        <div class="bio-panel__section-label">Archive context</div>
        <div class="bio-panel__context-grid">${identityHTML}</div>
        ${affiliationsHTML}
        ${relatedHTML}
        <div class="bio-panel__section-label">Biography</div>
        <div class="bio-panel__placeholder">
          <div class="bio-panel__placeholder-icon">BIO</div>
          <div class="bio-panel__placeholder-text">
            ${unit.lore ? escapeHtml(unit.lore) : `No biography entry has been added for ${escapeHtml(unit.name)} yet.`}
          </div>
        </div>
        ${abilityHTML}
      `;

      // Open panel
      document.getElementById("bioPanel").classList.add("open");
      document.getElementById("bioPanel").setAttribute("aria-hidden", "false");
      document.getElementById("bioBackdrop").classList.add("open");
      document.body.style.overflow = "";
    }

    function closeBioPanel() {
      document.getElementById("bioPanel").classList.remove("open");
      document.getElementById("bioPanel").setAttribute("aria-hidden", "true");
      document.getElementById("bioBackdrop").classList.remove("open");
      document.body.style.overflow = "";
    }

    document.getElementById("bioPanelClose").addEventListener("click", closeBioPanel);
    document.getElementById("bioBackdrop").addEventListener("click", closeBioPanel);
    document.getElementById("bioPanelBody").addEventListener("click", e => {
      const affiliationButton = e.target.closest("[data-affiliation-story]");
      if (affiliationButton) {
        window.location.href = `stories.html?story=${encodeURIComponent(affiliationButton.dataset.affiliationStory)}`;
        return;
      }
      const relatedButton = e.target.closest("[data-related-unit]");
      if (relatedButton) openBioPanel(relatedButton.dataset.relatedUnit);
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeBioPanel(); });

    // -- INIT --------------------------------------------------
    document.addEventListener("DOMContentLoaded", () => {
      renderAllUnits();

      document.querySelectorAll("#costFilters .filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#costFilters .filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          activeCost = btn.dataset.cost;
          renderAllUnits();
        });
      });

      document.querySelectorAll("#roleFilters .filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#roleFilters .filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          activeRole = btn.dataset.role;
          renderAllUnits();
        });
      });

      document.getElementById("unitSearch").addEventListener("input", e => {
        activeSearch = e.target.value.toLowerCase().trim();
        renderAllUnits();
      });

      // Nav scroll
      const nav = document.getElementById("nav");
      window.addEventListener("scroll", () => {
        nav.style.background = window.scrollY > 80
          ? "rgba(6,8,16,0.98)" : "rgba(6,8,16,0.92)";
      }, { passive: true });
    });

  </script>
